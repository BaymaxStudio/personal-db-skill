<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>个人资料库</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 20 20' fill='none' stroke='%23b23a26' stroke-width='1.8' stroke-linejoin='round' stroke-linecap='round'%3E%3Crect x='3' y='6' width='14' height='11' rx='2'/%3E%3Cpath d='M5.5 3.5h9M7.5 10h5M7.5 13h3'/%3E%3C/svg%3E">
<!-- 全部样式与脚本内联，字体只用系统自带，无任何外部请求：承诺"不联网"必须与产物一致。 -->
<style>
  :root {
    --bg: #f5f3ee;
    --surface: #fffefb;
    --surface-2: #f2efe8;
    --surface-3: #e9e5dc;
    --line: #e5e0d5;
    --line-2: #d5cec0;
    --ink: #1d1b17;
    --ink-2: #47423a;
    --muted: #7b7468;
    --faint: #a49d8f;
    --accent: #b23a26;          /* 朱砂：品牌、当前位置、焦点 */
    --accent-soft: rgba(178, 58, 38, .07);
    --accent-line: rgba(178, 58, 38, .3);
    --ok: #2e7a4e;
    --ok-soft: rgba(46, 122, 78, .1);
    --mark: rgba(233, 178, 52, .38);
    --shadow: 0 1px 2px rgba(60, 45, 20, .04), 0 4px 16px rgba(60, 45, 20, .035);
    --header-bg: rgba(245, 243, 238, .86);

    --serif: "Iowan Old Style", "Palatino Linotype", Palatino, "Songti SC", "Noto Serif CJK SC", "Source Han Serif SC", serif;
    --sans: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans CJK SC", system-ui, sans-serif;
    --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;

    --tb: 61px;       /* 顶栏实际高度，由脚本测量后回写 */
    --sticky: 61px;   /* 顶部吸附区总高度（窄屏含分区标签条） */
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #141311;
      --surface: #1b1a17;
      --surface-2: #23211d;
      --surface-3: #2d2a25;
      --line: #2d2a25;
      --line-2: #3c3832;
      --ink: #ede8de;
      --ink-2: #c6bfb2;
      --muted: #938b7e;
      --faint: #6d665a;
      --accent: #e07a5f;
      --accent-soft: rgba(224, 122, 95, .1);
      --accent-line: rgba(224, 122, 95, .38);
      --ok: #72c392;
      --ok-soft: rgba(114, 195, 146, .12);
      --mark: rgba(226, 170, 60, .32);
      --shadow: none;
      --header-bg: rgba(20, 19, 17, .86);
    }
  }

  *, *::before, *::after { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; scroll-padding-top: calc(var(--sticky) + 16px); }
  @media (prefers-reduced-motion: no-preference) { html { scroll-behavior: smooth; } }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font: 14.5px/1.7 var(--sans);
    -webkit-font-smoothing: antialiased;
  }
  button { font: inherit; color: inherit; background: none; border: 0; padding: 0; margin: 0; text-align: inherit; cursor: pointer; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 6px; }
  mark { background: var(--mark); color: inherit; border-radius: 3px; padding: 0 1px; }
  .i { width: 14px; height: 14px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }
  .i-check { display: none; }
  .copied .i-copy { display: none; }
  .copied .i-check { display: inline-block; color: var(--ok); opacity: 1 !important; }

  /* ── 顶栏 ── */
  .topbar {
    position: sticky; top: 0; z-index: 30;
    background: var(--header-bg);
    backdrop-filter: saturate(1.4) blur(14px);
    -webkit-backdrop-filter: saturate(1.4) blur(14px);
    border-bottom: 1px solid var(--line);
  }
  .topbar-in {
    max-width: 1200px; margin: 0 auto;
    display: flex; align-items: center; gap: 20px;
    min-height: 60px; padding: 10px 28px;
  }
  .brand { display: flex; align-items: center; gap: 9px; color: var(--ink); text-decoration: none; flex: none; }
  /* 标志：一叠档案卡的线条图标 */
  .brand-mark {
    width: 20px; height: 20px; flex: none;
    fill: none; stroke: var(--accent); stroke-width: 1.5;
    stroke-linecap: round; stroke-linejoin: round;
  }
  .brand-name { font: 600 17px/1 var(--serif); letter-spacing: .06em; }

  .search {
    flex: 1; max-width: 440px;
    display: flex; align-items: center; gap: 8px;
    height: 38px; padding: 0 10px 0 12px;
    background: var(--surface); color: var(--faint);
    border: 1px solid var(--line); border-radius: 10px;
    transition: border-color .15s, box-shadow .15s;
  }
  .search:focus-within { border-color: var(--accent-line); box-shadow: 0 0 0 3px var(--accent-soft); }
  .search input {
    flex: 1; min-width: 0; height: 100%;
    border: 0; outline: 0; background: none;
    font: inherit; font-size: 14px; color: var(--ink);
  }
  .search input::placeholder { color: var(--faint); }
  .search kbd {
    font: 500 11px/1 var(--mono); color: var(--faint);
    padding: 3px 6px; border: 1px solid var(--line-2); border-radius: 5px;
  }
  .search:focus-within kbd, .search.has-q kbd { display: none; }
  .qn { font-size: 12px; color: var(--muted); white-space: nowrap; font-variant-numeric: tabular-nums; }

  .tools { display: flex; align-items: center; gap: 8px; margin-left: auto; flex: none; }
  .seg { display: flex; padding: 3px; background: var(--surface-2); border: 1px solid var(--line); border-radius: 10px; }
  .seg button { height: 30px; padding: 0 12px; border-radius: 7px; font-size: 13px; color: var(--muted); transition: color .15s, background .15s; }
  .seg button:hover { color: var(--ink); }
  .seg button[aria-checked="true"] { background: var(--surface); color: var(--ink); font-weight: 600; box-shadow: 0 1px 2px rgba(0, 0, 0, .08); }
  .tbtn {
    display: inline-flex; align-items: center; gap: 6px;
    height: 38px; padding: 0 12px;
    border: 1px solid var(--line); border-radius: 10px;
    background: var(--surface); color: var(--muted); font-size: 13px;
    transition: color .15s, border-color .15s, background .15s;
  }
  .tbtn:hover { color: var(--ink); border-color: var(--line-2); }
  .tbtn[aria-pressed="true"] { color: var(--accent); border-color: var(--accent-line); background: var(--accent-soft); }

  /* ── 版面 ── */
  .layout {
    max-width: 1200px; margin: 0 auto;
    padding: 36px 28px 80px;
    display: grid; grid-template-columns: 200px minmax(0, 1fr); gap: 56px;
  }
  .rail { position: sticky; top: calc(var(--tb) + 36px); align-self: start; }
  main { min-width: 0; max-width: 800px; }

  .nav { display: flex; flex-direction: column; gap: 2px; }
  .nav a {
    position: relative;
    display: grid; grid-template-columns: 28px 1fr auto; align-items: center;
    padding: 7px 10px; border-radius: 8px;
    color: var(--muted); text-decoration: none; font-size: 13.5px;
    transition: color .15s, background .15s;
  }
  .nav a:hover { color: var(--ink); background: var(--surface-2); }
  .nav .no { font: 500 11px/1 var(--mono); color: var(--faint); }
  .nav .n { font-size: 12px; color: var(--faint); font-variant-numeric: tabular-nums; }
  .nav a.on { color: var(--ink); font-weight: 600; background: var(--surface); box-shadow: var(--shadow); }
  .nav a.on .no { color: var(--accent); }
  .nav a.on::before {
    content: ""; position: absolute; left: -12px; top: 9px; bottom: 9px;
    width: 2px; border-radius: 2px; background: var(--accent);
  }
  .nav a.is-empty { opacity: .38; pointer-events: none; }
  .rail-note {
    margin: 22px 10px 0; padding-top: 16px;
    border-top: 1px solid var(--line);
    font-size: 12px; line-height: 1.7; color: var(--faint);
  }

  /* ── 分区 ── */
  .sec + .sec { margin-top: 60px; }
  .sec-head {
    display: flex; align-items: baseline; gap: 12px;
    padding-bottom: 12px; margin-bottom: 18px;
    border-bottom: 1px solid var(--line);
  }
  .sec-no { font: 500 12px/1 var(--mono); color: var(--accent); }
  .sec-head h2 { margin: 0; font: 600 22px/1.3 var(--serif); letter-spacing: .03em; }
  .sec-en { font-size: 11px; letter-spacing: .16em; text-transform: uppercase; color: var(--faint); }
  .sec-n { margin-left: auto; font-size: 12px; color: var(--faint); font-variant-numeric: tabular-nums; }

  /* ── 卡片 ── */
  .card {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 16px;
    padding: 22px 24px 24px;
    box-shadow: var(--shadow);
  }
  .card + .card { margin-top: 14px; }
  .head { display: flex; gap: 16px; align-items: flex-start; }
  .head-main { flex: 1; min-width: 0; }
  .eyebrow { font-size: 12.5px; color: var(--muted); margin-bottom: 4px; }
  .title, .title-alt, .row-title { display: block; width: fit-content; max-width: 100%; cursor: copy; border-radius: 4px; transition: color .15s; }
  .title { font: 600 19px/1.5 var(--serif); color: var(--ink); letter-spacing: .01em; }
  .title-alt { margin-top: 3px; font-size: 13.5px; line-height: 1.55; color: var(--muted); }
  .title .i, .title-alt .i, .row-title .i { margin-left: 6px; vertical-align: -2px; color: var(--faint); opacity: 0; transition: opacity .15s; }
  .title:hover, .title-alt:hover, .row-title:hover { color: var(--accent); }
  .title:hover .i, .title-alt:hover .i, .row-title:hover .i,
  .title:focus-visible .i, .row-title:focus-visible .i { opacity: 1; }
  .head-side { flex: none; display: flex; align-items: center; gap: 10px; padding-top: 3px; }
  .when {
    font-size: 13px; color: var(--ink-2); white-space: nowrap;
    font-variant-numeric: tabular-nums; cursor: copy; border-radius: 4px;
  }
  .when:hover { color: var(--accent); }
  .dur { margin-left: 8px; color: var(--faint); }
  .act-all { opacity: 0; transition: opacity .15s; }
  .card:hover .act-all, .kid:hover .act-all, .act-all:focus-visible, .act-all.copied { opacity: 1; }

  .lang {
    display: inline-flex; align-items: center;
    height: 16px; padding: 0 5px; margin-left: 6px;
    border-radius: 4px; vertical-align: 2px;
    font: 600 10px/1 var(--sans); letter-spacing: .04em;
    color: var(--muted); background: var(--surface-3);
  }

  /* 可复制的字段块：对应表单上的一个输入框 */
  .fields { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 16px; }
  .tile {
    position: relative;
    display: flex; flex-direction: column; align-items: flex-start;
    min-width: 0; max-width: 100%;
    padding: 7px 32px 8px 12px;
    background: var(--surface-2);
    border: 1px solid transparent; border-radius: 10px;
    cursor: copy; text-align: left;
    transition: background .15s, border-color .15s;
  }
  .tile .k { font-size: 11.5px; line-height: 1.4; color: var(--muted); }
  .tile .v { font-size: 14px; line-height: 1.5; color: var(--ink); overflow-wrap: anywhere; }
  .tile > .i { position: absolute; top: 9px; right: 10px; color: var(--faint); opacity: 0; transition: opacity .15s; }
  .tile:hover { background: var(--surface); border-color: var(--line-2); }
  .tile:hover > .i, .tile:focus-visible > .i { opacity: 1; }
  .tile.copied { border-color: var(--ok); background: var(--ok-soft); }
  .tile .s, .metric .s {
    display: none; align-items: center; gap: 4px;
    max-width: 22em; margin-top: 3px;
    font-size: 11px; color: var(--faint);
  }
  .tile .s span, .metric .s span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .show-src .tile .s, .show-src .metric .s { display: flex; }
  .tile-grp { display: inline-flex; align-items: stretch; max-width: 100%; }
  .tile-grp .tile { border-top-right-radius: 0; border-bottom-right-radius: 0; }
  .tile-open {
    display: flex; align-items: center; padding: 0 11px;
    background: var(--surface-2); color: var(--muted);
    border-left: 1px solid var(--line); border-radius: 0 10px 10px 0;
    transition: color .15s, background .15s;
  }
  .tile-open:hover { color: var(--accent); background: var(--surface-3); }

  .metrics { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 10px; margin-top: 16px; }
  .metric {
    position: relative;
    display: flex; flex-direction: column; align-items: flex-start;
    padding: 12px 34px 13px 14px;
    background: var(--surface-2);
    border: 1px solid transparent; border-radius: 12px;
    cursor: copy; text-align: left;
    transition: background .15s, border-color .15s;
  }
  .metric .k { font-size: 11.5px; color: var(--muted); }
  .metric .num { margin-top: 2px; font-size: 24px; font-weight: 600; line-height: 1.25; font-variant-numeric: tabular-nums; letter-spacing: -.01em; }
  .metric .num small { margin-left: 1px; font-size: 14px; font-weight: 500; color: var(--muted); letter-spacing: 0; }
  .metric .note { margin-top: 5px; font-size: 11.5px; line-height: 1.55; color: var(--faint); }
  .metric > .i { position: absolute; top: 12px; right: 12px; color: var(--faint); opacity: 0; transition: opacity .15s; }
  .metric:hover { background: var(--surface); border-color: var(--line-2); }
  .metric:hover > .i, .metric:focus-visible > .i { opacity: 1; }
  .metric.copied { border-color: var(--ok); background: var(--ok-soft); }

  /* 长文本：描述、职责、成果 */
  .prose { margin-top: 22px; }
  .prose.paired { margin-top: 12px; }
  .p-head { display: flex; align-items: center; gap: 8px; min-height: 28px; margin-bottom: 4px; }
  .p-label { font-size: 13px; font-weight: 600; color: var(--ink-2); }
  .p-count { font-size: 12px; color: var(--faint); font-variant-numeric: tabular-nums; white-space: nowrap; }
  .p-count.over { color: var(--accent); font-weight: 600; }
  .p-acts { margin-left: auto; display: flex; gap: 2px; }
  .act {
    display: inline-flex; align-items: center; gap: 5px;
    height: 26px; padding: 0 8px; border-radius: 7px;
    font-size: 12px; color: var(--muted); white-space: nowrap;
    transition: color .15s, background .15s;
  }
  .act:hover { color: var(--ink); background: var(--surface-2); }
  .act[aria-expanded="true"], .show-src .act[data-src] { color: var(--accent); }
  .text {
    max-width: 46em;
    margin: 0 -10px; padding: 6px 10px;
    border-radius: 10px;
    font-size: 15px; line-height: 1.85; color: var(--ink);
    white-space: pre-wrap; overflow-wrap: anywhere;
    cursor: copy; transition: background .15s;
  }
  .text:hover { background: var(--surface-2); }
  .text.copied { background: var(--ok-soft); }
  .text.clamp { display: -webkit-box; -webkit-line-clamp: 7; -webkit-box-orient: vertical; overflow: hidden; }
  .more { margin-top: 4px; font-size: 12.5px; color: var(--accent); }
  .more:hover { text-decoration: underline; text-underline-offset: 3px; }

  .src { display: none; margin-top: 8px; padding: 12px 14px; border-radius: 10px; background: var(--surface-2); font-size: 12.5px; }
  .src.open, .show-src .src { display: block; }
  .src-item + .src-item { margin-top: 10px; padding-top: 10px; border-top: 1px dashed var(--line-2); }
  .src-file { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; color: var(--ink-2); }
  .src-file b { font-weight: 600; overflow-wrap: anywhere; }
  .src-tag { font-size: 10.5px; line-height: 1.6; padding: 0 6px; border-radius: 4px; background: var(--surface-3); color: var(--muted); }
  /* 来源分级：一手凭证 / 本人陈述 / 二手（简历） */
  .tier { flex: none; font-size: 10.5px; font-weight: 600; line-height: 1.6; padding: 0 6px; border-radius: 4px; }
  .tier-primary { color: var(--ok); background: var(--ok-soft); }
  .tier-self { color: var(--ink-2); background: var(--surface-3); }
  .tier-secondary { color: var(--muted); box-shadow: inset 0 0 0 1px var(--line-2); }
  .s .tier { font-size: 10px; line-height: 1.5; padding: 0 5px; }
  .src blockquote {
    margin: 6px 0 0; padding-left: 10px;
    border-left: 2px solid var(--accent-line);
    color: var(--muted); line-height: 1.75; white-space: pre-wrap; overflow-wrap: anywhere;
  }

  /* 现成文案：已写好、可整段粘贴的介绍 */
  .stmt {
    margin-top: 20px; padding: 12px 16px 16px;
    background: var(--surface-2);
    border-left: 3px solid var(--accent); border-radius: 4px 12px 12px 4px;
  }
  .stmt-tag { font-size: 11px; font-weight: 600; letter-spacing: .06em; color: var(--accent); }
  .stmt .text:hover { background: var(--surface); }
  .roles { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; margin-top: 10px; font-size: 11.5px; color: var(--faint); }
  .roles span { padding: 1px 8px; border-radius: 999px; background: var(--surface); border: 1px solid var(--line); color: var(--muted); }

  /* 从属条目：辅修、作品集里的仓库 */
  .kids { margin-top: 26px; padding-top: 16px; border-top: 1px solid var(--line); }
  .kids-label { font-size: 11px; letter-spacing: .14em; color: var(--faint); }
  .kid { margin-top: 16px; padding: 2px 0 2px 18px; border-left: 2px solid var(--line-2); }
  .kid + .kid { margin-top: 26px; }
  .kid .title { font-size: 16.5px; }
  .kid .prose { margin-top: 16px; }

  /* 列表式分区：奖项、技能 */
  .list { padding: 4px 24px; }
  .row { display: grid; grid-template-columns: 84px minmax(0, 1fr); gap: 20px; padding: 18px 0; }
  .row + .row { border-top: 1px solid var(--line); }
  .row-key { padding-top: 2px; font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }
  .row-key .act { margin: 6px 0 0 -8px; }
  .row-title { font-size: 15.5px; font-weight: 600; line-height: 1.55; color: var(--ink); }
  .row .title-alt { font-size: 13px; }
  .row .text { font-size: 14px; line-height: 1.8; color: var(--ink-2); }
  .mini { margin-top: 6px; }
  .mini-foot { display: flex; align-items: center; gap: 2px; margin-top: 2px; }
  .mini-foot .p-count { margin-right: 6px; }

  .pills { display: flex; flex-wrap: wrap; gap: 8px; }
  .pill { display: inline-flex; align-items: stretch; max-width: 100%; border: 1px solid var(--line-2); border-radius: 999px; overflow: hidden; background: var(--surface); }
  .pill button { display: inline-flex; align-items: center; padding: 4px 12px; font-size: 13.5px; line-height: 1.6; cursor: copy; transition: background .15s; }
  .pill button + button { border-left: 1px solid var(--line); color: var(--muted); }
  .pill button:hover { background: var(--surface-2); }
  .pill button.copied { background: var(--ok-soft); }
  .notes { margin: 12px 0 0; padding: 0; list-style: none; }
  .notes li {
    margin: 0 -10px; padding: 5px 10px; border-radius: 8px;
    font-size: 13.5px; line-height: 1.75; color: var(--ink-2); cursor: copy;
    transition: background .15s;
  }
  .notes li:hover { background: var(--surface-2); }
  .notes li.copied { background: var(--ok-soft); }
  .notes b { margin-right: 8px; font-weight: 600; color: var(--ink); }

  /* 基本信息 */
  .profile { padding: 26px 26px 26px; }
  .who { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 16px; }
  .who .title { font-size: 30px; line-height: 1.3; letter-spacing: .06em; }
  .who .title-alt { margin: 0; font: 500 17px/1.3 var(--serif); letter-spacing: .04em; color: var(--muted); }
  .profile .fields { display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); margin-top: 20px; }
  .profile .tile { width: 100%; }

  .empty { padding: 56px 24px; text-align: center; color: var(--muted); border: 1px dashed var(--line-2); border-radius: 16px; }
  .empty button { margin-top: 10px; color: var(--accent); }
  .foot { margin-top: 64px; padding-top: 18px; border-top: 1px solid var(--line); font-size: 12px; line-height: 1.8; color: var(--faint); }
  .loading { padding: 80px 0; text-align: center; color: var(--faint); }

  #toast {
    position: fixed; left: 50%; bottom: 28px; z-index: 60;
    display: flex; align-items: center; gap: 8px;
    max-width: calc(100vw - 32px);
    padding: 9px 16px; border-radius: 999px;
    background: var(--ink); color: var(--bg); font-size: 13px;
    box-shadow: 0 8px 28px rgba(0, 0, 0, .18);
    opacity: 0; pointer-events: none;
    transform: translate(-50%, 10px);
    transition: opacity .18s, transform .18s;
  }
  #toast.on { opacity: 1; transform: translate(-50%, 0); }
  #toast .i { stroke-width: 2; }

  @media (hover: none) {
    .title .i, .title-alt .i, .row-title .i, .tile > .i, .metric > .i { opacity: .45; }
    .act-all { opacity: .8; }
  }

  /* ── 窄屏：与网申页面并排的半屏，或手机 ── */
  @media (max-width: 1023px) {
    .layout { display: block; padding: 0 0 64px; }
    .rail {
      position: sticky; top: var(--tb); z-index: 20;
      background: var(--header-bg);
      backdrop-filter: saturate(1.4) blur(14px);
      -webkit-backdrop-filter: saturate(1.4) blur(14px);
      border-bottom: 1px solid var(--line);
    }
    .nav { flex-direction: row; gap: 4px; padding: 8px 20px; overflow-x: auto; scrollbar-width: none; }
    .nav::-webkit-scrollbar { display: none; }
    .nav a { display: flex; gap: 6px; padding: 5px 12px; white-space: nowrap; font-size: 13px; }
    .nav .no { display: none; }
    .nav a.on::before { display: none; }
    .rail-note { display: none; }
    main { max-width: 800px; margin: 0 auto; padding: 28px 20px 0; }
    .topbar-in { padding: 10px 20px; }
  }
  @media (max-width: 640px) {
    .topbar-in { flex-wrap: wrap; gap: 10px 12px; }
    .search { order: 3; flex-basis: 100%; max-width: none; }
    .search kbd { display: none; }
    .tbtn span { display: none; }
    .nav { padding: 8px 16px; }
    main { padding: 22px 14px 0; }
    .card { padding: 18px 16px 20px; border-radius: 14px; }
    .profile { padding: 20px 16px; }
    .who .title { font-size: 26px; }
    .head { flex-direction: column; gap: 4px; }
    .head-side { order: -1; align-self: stretch; justify-content: space-between; padding-top: 0; }
    .act-all { order: 2; }
    .title { font-size: 17.5px; }
    .list { padding: 2px 16px; }
    .row { grid-template-columns: 1fr; gap: 6px; }
    .row-key .act { margin: 0 0 0 8px; }
    .row-key { display: flex; align-items: center; }
    .sec-head h2 { font-size: 20px; }
    .sec-en { display: none; }
    .text { font-size: 14.5px; }
    .kid { padding-left: 14px; }
  }
</style>
</head>
<body>

<header class="topbar">
  <div class="topbar-in">
    <a class="brand" href="#top" aria-label="回到顶部"><svg class="brand-mark" viewBox="0 0 20 20" aria-hidden="true"><rect x="3" y="6" width="14" height="11" rx="2"/><path d="M5.5 3.5h9M7.5 10h5M7.5 13h3"/></svg><span class="brand-name">个人资料库</span></a>
    <label class="search" id="searchBox">
      <svg class="i" viewBox="0 0 16 16" aria-hidden="true"><circle cx="7" cy="7" r="4.75"/><path d="M10.5 10.5l3.25 3.25"/></svg>
      <input id="q" type="search" placeholder="搜索内容、机构、关键词" autocomplete="off" spellcheck="false" aria-label="搜索">
      <span class="qn" id="qn"></span>
      <kbd>⌘K</kbd>
    </label>
    <div class="tools">
      <div class="seg" id="langSeg" role="radiogroup" aria-label="显示语言">
        <button type="button" role="radio" data-lang="zh" title="只看中文版本">中文</button>
        <button type="button" role="radio" data-lang="en" title="只看英文版本">EN</button>
        <button type="button" role="radio" data-lang="both" title="中英文对照">对照</button>
      </div>
      <button type="button" class="tbtn" id="srcBtn" aria-pressed="false" title="显示每条事实出自哪份材料，一手凭证排在最前">
        <svg class="i" viewBox="0 0 16 16" aria-hidden="true"><path d="M4 1.75h5.25L12.5 5v9.25H4z"/><path d="M9 1.75V5.25h3.5"/><path d="M6.25 8.5h3.5M6.25 11h3.5"/></svg><span>来源</span>
      </button>
    </div>
  </div>
</header>

<div class="layout" id="top">
  <aside class="rail">
    <nav class="nav" id="nav" aria-label="分区"></nav>
    <p class="rail-note">只显示本人确认过的事实。点任意内容即可复制，粘到网申表单里。</p>
  </aside>
  <main id="main"><div class="loading">正在读取资料库…</div></main>
</div>

<div id="toast" role="status" aria-live="polite"></div>

<script>
'use strict';

const root = document.documentElement;
const CLAMP_AT = 360;  // 超过这个字数的长文本默认折叠成 7 行
const NARROW = matchMedia('(max-width: 1023px)');

const store = {
  get(key, fallback) { try { return localStorage.getItem(key) ?? fallback; } catch { return fallback; } },
  // 隐私窗口等场景写不进去时，只是记不住偏好，不影响使用
  set(key, value) { try { localStorage.setItem(key, value); } catch { /* 见上 */ } },
};

const state = {
  data: null,
  byId: new Map(),
  q: '',
  lang: ['zh', 'en', 'both'].includes(store.get('pdb.lang')) ? store.get('pdb.lang') : 'zh',
  showSrc: store.get('pdb.src') === '1',
  expanded: new Set(),
  openSrc: new Set(),
};

const svg = (cls, body) => `<svg class="i ${cls}" viewBox="0 0 16 16" aria-hidden="true">${body}</svg>`;
const I = {
  copy: svg('i-copy', '<rect x="5.25" y="5.25" width="8.5" height="8.5" rx="1.75"/><path d="M10.75 5.25V3.5c0-.7-.55-1.25-1.25-1.25h-6c-.7 0-1.25.55-1.25 1.25v6c0 .7.55 1.25 1.25 1.25h1.75"/>'),
  check: svg('i-check', '<path d="M3.25 8.5l3 3 6.5-7"/>'),
  doc: svg('i-doc', '<path d="M4 1.75h5.25L12.5 5v9.25H4z"/><path d="M9 1.75V5.25h3.5"/><path d="M6.25 8.5h3.5M6.25 11h3.5"/>'),
  out: svg('i-out', '<path d="M9.5 2.25h4.25V6.5M13.5 2.5 7.5 8.5M12 9.75v4H2.25V4h4"/>'),
};
const COPY_ICONS = I.copy + I.check;

const esc = s => String(s ?? '').replace(/[&<>"']/g, ch =>
  ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[ch]));

function hl(text) {
  const safe = esc(text);
  if (!state.q) return safe;
  const pattern = esc(state.q).replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
  return safe.replace(new RegExp(pattern, 'gi'), m => `<mark>${m}</mark>`);
}

/* ── 复制 ── */

// 每次渲染重建：data-c 只存序号，原文留在内存里，避免把长文本塞进属性
let copyReg = [];
function cp(text, label) {
  copyReg.push({ text: String(text), label: label || '' });
  return `data-c="${copyReg.length - 1}"`;
}

async function writeClipboard(text) {
  try {
    await navigator.clipboard.writeText(text);
    return true;
  } catch {
    const ta = document.createElement('textarea');
    ta.value = text;
    ta.setAttribute('readonly', '');
    ta.style.cssText = 'position:fixed;top:0;left:0;opacity:0';
    document.body.appendChild(ta);
    ta.select();
    try { return document.execCommand('copy'); } finally { ta.remove(); }
  }
}

async function copyFrom(el) {
  const item = copyReg[Number(el.dataset.c)];
  if (!item) return;
  if (!(await writeClipboard(item.text))) {
    toast('复制失败，请手动选中文字复制');
    return;
  }
  el.classList.add('copied');
  clearTimeout(el._copiedTimer);
  el._copiedTimer = setTimeout(() => el.classList.remove('copied'), 1300);
  const n = [...item.text].length;
  toast(`已复制${item.label ? ' · ' + item.label : ''}${n > 40 ? `（${n} 字）` : ''}`);
}

let toastTimer;
function toast(msg) {
  const el = document.getElementById('toast');
  el.innerHTML = svg('', '<path d="M3.25 8.5l3 3 6.5-7"/>') + `<span>${esc(msg)}</span>`;
  el.classList.add('on');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('on'), 1600);
}

/* ── 数据整理 ── */

const slot = locale => !locale ? 'na' : locale.toLowerCase().startsWith('zh') ? 'zh' : 'en';
const langBadge = locale => {
  const s = slot(locale);
  return s === 'na' ? '' : `<span class="lang" title="${s === 'zh' ? '中文版本' : '英文版本'}">${s === 'zh' ? '中' : 'EN'}</span>`;
};

function prepare(data) {
  for (const e of data.entities) {
    e.f = new Map();
    for (const fact of e.facts) {
      const m = e.f.get(fact.field) || {};
      const s = slot(fact.locale);
      if (!m[s]) m[s] = fact;
      e.f.set(fact.field, m);
    }
    e.children = [];
    e.hay = [e.name, ...e.facts.map(f => `${f.label} ${f.value}`), ...e.expressions.map(x => `${x.purpose} ${x.text}`)]
      .join('\n').toLowerCase();
    state.byId.set(e.id, e);
  }
  for (const e of data.entities) {
    if (e.parent && state.byId.has(e.parent)) state.byId.get(e.parent).children.push(e);
  }
}

// 按当前语言取某字段要显示的版本。单语模式缺该语言时回退到另一种语言，并打上语言标记。
function variants(e, field, lang = state.lang) {
  const m = e.f.get(field);
  if (!m) return [];
  if (lang === 'both') {
    const pair = [m.zh, m.en].filter(Boolean).map(f => ({ f, badge: true }));
    // 中英文写法完全相同（分数、日期、专有名词）时只显示一份
    if (pair.length === 2 && pair[0].f.value === pair[1].f.value) return [{ f: pair[0].f, badge: false }];
    if (pair.length) return pair;
    return m.na ? [{ f: m.na, badge: false }] : [];
  }
  if (m[lang]) return [{ f: m[lang], badge: false }];
  if (m.na) return [{ f: m.na, badge: false }];
  const other = m[lang === 'zh' ? 'en' : 'zh'];
  return other ? [{ f: other, badge: true }] : [];
}
const singleLang = () => state.lang === 'both' ? 'zh' : state.lang;
const firstValue = (e, field, lang = singleLang()) => variants(e, field, lang)[0]?.f.value || '';

const EXP_TILES = [
  'experience.organization', 'experience.role', 'experience.fact.role', 'experience.fact.department', 'experience.fact.level',
  'experience.fact.score', 'experience.fact.phone', 'experience.fact.relation',
  'experience.fact.account', 'experience.fact.gear', 'experience.fact.homeurl', 'experience.fact.url',
];
const EDU_TILES = ['education.degree', 'education.major', 'education.institution', 'education.location'];
const EDU_METRICS = ['education.gpa', 'education.averageScore', 'education.ranking'];
const EDU_HIDDEN = new Set(['education.startDate', 'education.endDate', ...EDU_METRICS]);

function titleField(e) {
  if (e.type === 'experience') return e.f.has('experience.fact.topic') ? 'experience.fact.topic' : 'experience.title';
  if (e.type === 'education') return e.parent && e.f.has('education.major') ? 'education.major' : 'education.institution';
  return { award: 'award.name', skill: 'skill.name', person: 'person.fullName.zhCN' }[e.type] || '';
}

function titleVariants(e, lang = state.lang) {
  const vs = variants(e, titleField(e), lang);
  return vs.length ? vs : [{ f: { value: e.name, locale: '', sources: [] }, badge: false }];
}

// 科研条目以论文题目为标题时，把竞赛 / 项目名放到标题上方
function eyebrowOf(e, lang = singleLang()) {
  if (e.type === 'experience' && e.f.has('experience.fact.topic')) return firstValue(e, 'experience.title', lang);
  return '';
}

function fieldLabel(e, field, label) {
  if (field === 'experience.role') return { internship: '职位', campus: '职务' }[e.section] || '角色';
  return label;
}

function tileFields(e) {
  if (e.type === 'experience') {
    const titles = new Set([e.name, ...titleVariants(e, 'both').map(v => v.f.value)]);
    const orgValues = Object.values(e.f.get('experience.organization') || {}).map(f => f.value);
    const orgIsTitle = orgValues.length && orgValues.every(v => titles.has(v));
    return EXP_TILES.filter(fd => e.f.has(fd) && !(fd === 'experience.organization' && orgIsTitle));
  }
  if (e.type === 'education') {
    const tf = titleField(e);
    const known = EDU_TILES.filter(fd => e.f.has(fd) && fd !== tf && !(e.parent && fd === 'education.institution'));
    const extra = [...e.f.keys()].filter(fd => !EDU_TILES.includes(fd) && !EDU_HIDDEN.has(fd));
    return known.concat(extra);
  }
  return [];
}

function proseFields(e) {
  if (e.type !== 'experience') return [];
  const tf = titleField(e);
  return [...e.f.keys()].filter(fd =>
    fd.startsWith('experience.fact.') && fd !== tf && fd !== 'experience.fact.topic' && !EXP_TILES.includes(fd));
}

const fmtDate = d => d ? d.replace(/-/g, '.') : '';
function period(e) {
  const s = fmtDate(e.start), t = fmtDate(e.end);
  return s && t ? `${s} – ${t}` : s || t;
}
function duration(e) {
  const a = /^(\d{4})-(\d{2})/.exec(e.start || ''), b = /^(\d{4})-(\d{2})/.exec(e.end || '');
  if (!a || !b) return '';
  const n = (b[1] - a[1]) * 12 + (b[2] - a[2]) + 1;
  if (n <= 0) return '';
  if (n < 12) return `${n} 个月`;
  return n % 12 ? `${Math.floor(n / 12)} 年 ${n % 12} 个月` : `${n / 12} 年`;
}

// 网申字数限制：中文按字符数，英文同时给词数和字符数
function countOf(text) {
  const chars = [...text.replace(/\n/g, '')].length;
  if (/[㐀-鿿]/.test(text)) return `${chars} 字`;
  const words = (text.match(/[A-Za-z0-9][\w'’.-]*/g) || []).length;
  return `${words} 词 · ${chars} 字符`;
}

function entityText(e) {
  const lang = singleLang();
  const lines = [titleVariants(e, lang)[0].f.value];
  const eyebrow = eyebrowOf(e, lang);
  if (eyebrow) lines.push(eyebrow);
  const meta = tileFields(e).map(fd => firstValue(e, fd, lang)).filter(Boolean);
  if (meta.length) lines.push(meta.join(' | '));
  if (period(e)) lines.push(period(e).replace(' – ', ' - '));
  for (const fd of proseFields(e)) {
    const v = variants(e, fd, lang)[0];
    if (v) lines.push('', `${v.f.label}：${v.f.value}`);
  }
  return lines.join('\n');
}

/* ── 搜索 ── */

const selfMatch = e => !state.q || e.hay.includes(state.q.toLowerCase());
function visibleTree(e) {
  const self = selfMatch(e);
  const kids = e.children.filter(k => self || selfMatch(k));
  return self || kids.length ? { e, kids } : null;
}

/* ── 渲染：零件 ── */

const domId = id => 'e-' + id.replace(/[^\w-]/g, '_');

// 来源暂按文件名推测等级并排序，不能替代原件核验。
const tierOf = id => state.data?.sourceTiers?.find(t => t.id === id) || { id, label: id, hint: '' };
const integrityLabel = s => ({ changed: '文件已变更，待核对', missing: '文件缺失', unreadable: '文件无法读取' }[s.integrity] || '');
const tierChip = id => {
  const t = tierOf(id);
  return `<span class="tier tier-${esc(t.id)}" title="${esc(t.hint)}">${esc(t.label)}</span>`;
};

function srcLine(f) {
  const best = f.sources?.[0];
  if (!best) return '';
  const more = f.sources.length > 1 ? ` 等 ${f.sources.length} 份` : '';
  const warning = integrityLabel(best);
  return `<span class="s">${tierChip(best.tier)}<span>${esc(best.file)}${more}${warning ? ` · ${esc(warning)}` : ''}</span></span>`;
}

function srcTitle(f) {
  if (!f.sources?.length) return '点击复制';
  return '点击复制\n\n来源：\n' + f.sources.map(s =>
    `${tierOf(s.tier).label} · ${s.file}${s.locator ? `（${s.locator}）` : ''}${integrityLabel(s) ? ` · ${integrityLabel(s)}` : ''}`).join('\n');
}

function srcPanel(f, key, open) {
  if (!f.sources?.length) return '';
  return `<div class="src${open ? ' open' : ''}" data-src-box="${esc(key)}">${f.sources.map(s => `
    <div class="src-item">
      <div class="src-file">${tierChip(s.tier)}<b>${esc(s.file)}</b><span class="src-tag">${esc((s.type || '').toUpperCase())}</span>${s.locator ? `<span class="src-tag">${esc(s.locator)}</span>` : ''}${integrityLabel(s) ? `<span class="src-tag">${esc(integrityLabel(s))}</span>` : ''}</div>
      <blockquote>${esc(s.excerpt)}</blockquote>
    </div>`).join('')}</div>`;
}

function srcButton(f, key, open) {
  if (!f.sources?.length) return '';
  return `<button type="button" class="act" data-src="${esc(key)}" aria-expanded="${open}" title="查看出处，一手凭证排在最前">${I.doc}来源 ${f.sources.length}</button>`;
}

function tile(v, label) {
  const f = v.f;
  const isUrl = /^https?:\/\//i.test(f.value);
  const shown = isUrl ? f.value.replace(/^https?:\/\//i, '').replace(/\/$/, '') : f.value;
  const btn = `<button type="button" class="tile" ${cp(f.value, label)} title="${esc(srcTitle(f))}">
      <span class="k">${esc(label)}${v.badge ? langBadge(f.locale) : ''}</span>
      <span class="v">${hl(shown)}</span>${srcLine(f)}${COPY_ICONS}
    </button>`;
  if (!isUrl) return btn;
  return `<span class="tile-grp">${btn}<a class="tile-open" href="${esc(f.value)}" target="_blank" rel="noopener noreferrer" title="在新标签页打开" aria-label="打开 ${esc(shown)}">${I.out}</a></span>`;
}

function tilesHtml(e, fields, { badges = true } = {}) {
  const out = [];
  for (const fd of fields) {
    for (const v of variants(e, fd)) out.push(tile(badges ? v : { ...v, badge: false }, fieldLabel(e, fd, v.f.label)));
  }
  return out.length ? `<div class="fields">${out.join('')}</div>` : '';
}

function metricsHtml(e) {
  const out = [];
  for (const fd of EDU_METRICS) {
    const v = variants(e, fd, singleLang())[0];
    if (!v) continue;
    const raw = v.f.value;
    const cut = raw.search(/[（(]/);
    const main = (cut >= 0 ? raw.slice(0, cut) : raw).trim();
    const note = cut >= 0 ? raw.slice(cut).replace(/^[（(]\s*|\s*[）)]$/g, '') : '';
    const [num, den] = main.split('/');
    out.push(`<button type="button" class="metric" ${cp(main, v.f.label)} title="${esc(srcTitle(v.f))}">
      <span class="k">${esc(v.f.label)}</span>
      <span class="num">${hl(num)}${den !== undefined ? `<small>/${esc(den)}</small>` : ''}</span>
      ${note ? `<span class="note">${hl(note)}</span>` : ''}${srcLine(v.f)}${COPY_ICONS}
    </button>`);
  }
  return out.length ? `<div class="metrics">${out.join('')}</div>` : '';
}

function proseBlock(v, { paired = false, label } = {}) {
  const f = v.f;
  const key = f.id;
  const clamp = !state.q && [...f.value].length > CLAMP_AT;
  const folded = clamp && !state.expanded.has(key);
  const open = state.openSrc.has(key);
  const name = label || f.label;
  return `<div class="prose${paired ? ' paired' : ''}">
    <div class="p-head">
      <span class="p-label">${esc(name)}</span>${v.badge ? langBadge(f.locale) : ''}
      <span class="p-count">${countOf(f.value)}</span>
      <span class="p-acts">${srcButton(f, key, open)}<button type="button" class="act" ${cp(f.value, name)}>${COPY_ICONS}<span>复制</span></button></span>
    </div>
    <div class="text${folded ? ' clamp' : ''}" ${cp(f.value, name)}>${hl(f.value)}</div>
    ${clamp ? `<button type="button" class="more" data-more="${esc(key)}">${folded ? '展开全文' : '收起'}</button>` : ''}
    ${srcPanel(f, key, open)}
  </div>`;
}

// 奖项、技能里的短说明：正文在前，字数和操作收在一行小字里
function miniProse(v, label) {
  const f = v.f;
  const key = f.id;
  const open = state.openSrc.has(key);
  return `<div class="mini">
    <div class="text" ${cp(f.value, label)}>${hl(f.value)}${v.badge ? langBadge(f.locale) : ''}</div>
    <div class="mini-foot"><span class="p-count">${countOf(f.value)}</span>${srcButton(f, key, open)}<button type="button" class="act" ${cp(f.value, label)}>${COPY_ICONS}<span>复制</span></button></div>
    ${srcPanel(f, key, open)}
  </div>`;
}

function statement(x) {
  const n = [...x.text.replace(/\n/g, '')].length;
  const over = x.maxChars && n > x.maxChars;
  const mismatch = state.lang === 'both' || (x.locale && slot(x.locale) !== state.lang);
  return `<div class="stmt">
    <div class="p-head">
      <span class="stmt-tag">现成文案</span>
      <span class="p-label">${hl(x.purpose)}</span>${mismatch ? langBadge(x.locale) : ''}
      <span class="p-count${over ? ' over' : ''}" title="${x.maxChars ? '当前字数 / 字数上限' : ''}">${x.maxChars ? `${n} / ${x.maxChars} 字` : countOf(x.text)}</span>
      <span class="p-acts"><button type="button" class="act" ${cp(x.text, x.purpose)}>${COPY_ICONS}<span>复制</span></button></span>
    </div>
    <div class="text" ${cp(x.text, x.purpose)}>${hl(x.text)}</div>
    ${x.targetRoles?.length ? `<div class="roles">适用方向${x.targetRoles.map(r => `<span>${esc(r)}</span>`).join('')}</div>` : ''}
  </div>`;
}

function titleButtons(e, cls = 'title') {
  const tv = titleVariants(e);
  return tv.map((v, i) => `<button type="button" class="${i ? 'title-alt' : cls}" ${cp(v.f.value, '名称')} title="${esc(srcTitle(v.f))}">${hl(v.f.value)}${v.badge ? langBadge(v.f.locale) : ''}${COPY_ICONS}</button>`).join('');
}

/* ── 渲染：各类条目 ── */

function entityCard(e, kids, depth = 0) {
  const eyebrow = eyebrowOf(e);
  const when = period(e);
  const dur = e.section === 'internship' ? duration(e) : '';
  const head = `<div class="head">
      <div class="head-main">
        ${eyebrow ? `<div class="eyebrow">${hl(eyebrow)}</div>` : ''}
        ${titleButtons(e)}
      </div>
      <div class="head-side">
        <button type="button" class="act act-all" ${cp(entityText(e), '整条')} title="按当前语言复制这一条的全部内容">${COPY_ICONS}<span>复制整条</span></button>
        ${when ? `<button type="button" class="when" ${cp(when.replace(' – ', ' - '), '起止时间')} title="点击复制起止时间">${when}${dur ? `<span class="dur">${dur}</span>` : ''}</button>` : ''}
      </div>
    </div>`;
  const body = [
    tilesHtml(e, tileFields(e)),
    e.type === 'education' ? metricsHtml(e) : '',
    e.expressions.map(statement).join(''),
    proseFields(e).map(fd => variants(e, fd).map((v, i) => proseBlock(v, { paired: i > 0 })).join('')).join(''),
  ].join('');
  const kidsLabel = e.type === 'education' ? '辅修' : '包含项目';
  const kidsHtml = kids.length
    ? `<div class="kids"><div class="kids-label">${kidsLabel} · ${kids.length}</div>${kids.map(k => entityCard(k, [], depth + 1)).join('')}</div>`
    : '';
  return depth
    ? `<div class="kid" id="${domId(e.id)}">${head}${body}</div>`
    : `<article class="card" id="${domId(e.id)}">${head}${body}${kidsHtml}</article>`;
}

function profileCard(e) {
  const zh = variants(e, 'person.fullName.zhCN', 'zh')[0];
  const en = variants(e, 'person.fullName.en', 'en')[0];
  const names = [zh && [zh, 'title', '中文姓名'], en && [en, 'title-alt', '英文姓名']].filter(Boolean);
  const rest = [...e.f.keys()].filter(fd => fd !== 'person.fullName.zhCN' && fd !== 'person.fullName.en');
  return `<article class="card profile" id="${domId(e.id)}">
    <div class="who">${names.map(([v, cls, label]) =>
      `<button type="button" class="${cls}" ${cp(v.f.value, label)} title="${esc(srcTitle(v.f))}">${hl(v.f.value)}${COPY_ICONS}</button>`).join('')}</div>
    ${tilesHtml(e, rest, { badges: false })}
  </article>`;
}

function awardList(items) {
  return `<div class="card list">${items.map(e => {
    const names = variants(e, 'award.name');
    const title = names.length
      ? names.map((v, i) => `<button type="button" class="${i ? 'title-alt' : 'row-title'}" ${cp(v.f.value, '奖项名称')} title="${esc(srcTitle(v.f))}">${hl(v.f.value)}${v.badge ? langBadge(v.f.locale) : ''}${COPY_ICONS}</button>`).join('')
      : `<button type="button" class="row-title" ${cp(e.name, '奖项名称')}>${hl(e.name)}${COPY_ICONS}</button>`;
    const details = variants(e, 'award.details').map(v => miniProse(v, '获奖说明')).join('');
    return `<div class="row" id="${domId(e.id)}">
      <div class="row-key">${fmtDate(e.start)}</div>
      <div>${title}${details}</div>
    </div>`;
  }).join('')}</div>`;
}

function skillName(e, lang) {
  return firstValue(e, 'skill.name', lang) || e.name;
}

function skillList(items) {
  const cats = state.data.skillCategories;
  const byCat = new Map();
  for (const e of items) {
    const cat = firstValue(e, 'skill.category', 'zh') || 'other';
    if (!byCat.has(cat)) byCat.set(cat, []);
    byCat.get(cat).push(e);
  }
  const order = [...cats.map(c => c.id), ...[...byCat.keys()].filter(k => !cats.some(c => c.id === k))];
  const rows = order.filter(id => byCat.has(id)).map(id => {
    const list = byCat.get(id);
    const label = cats.find(c => c.id === id)?.label || id;
    const lang = singleLang();
    const summary = list.map(e => {
      const lvl = firstValue(e, 'skill.level', lang);
      const name = skillName(e, lang);
      if (!lvl) return name;
      return lang === 'en' ? `${name} (${lvl})` : `${name}（${lvl}）`;
    }).join(lang === 'en' ? ', ' : '、');
    const pills = list.map(e => {
      const segs = [
        ...variants(e, 'skill.name').map(v => [v, '技能']),
        ...variants(e, 'skill.level').map(v => [v, '水平']),
      ];
      if (!segs.length) segs.push([{ f: { value: e.name, locale: '', sources: [] }, badge: false }, '技能']);
      return `<span class="pill" id="${domId(e.id)}">${segs.map(([v, what]) =>
        `<button type="button" ${cp(v.f.value, `${skillName(e, lang)} ${what}`)} title="${esc(srcTitle(v.f))}">${hl(v.f.value)}${v.badge ? langBadge(v.f.locale) : ''}</button>`).join('')}</span>`;
    }).join('');
    const notes = list.flatMap(e => variants(e, 'skill.details').map(v =>
      `<li ${cp(v.f.value, `${skillName(e, lang)} 说明`)} title="${esc(srcTitle(v.f))}"><b>${hl(skillName(e, lang))}</b>${hl(v.f.value)}${v.badge ? langBadge(v.f.locale) : ''}</li>`)).join('');
    return `<div class="row">
      <div class="row-key">${esc(label)}<br><button type="button" class="act" ${cp(summary, `全部${label}`)} title="把这一类合成一行复制">${COPY_ICONS}<span>复制本类</span></button></div>
      <div><div class="pills">${pills}</div>${notes ? `<ul class="notes">${notes}</ul>` : ''}</div>
    </div>`;
  }).join('');
  return `<div class="card list">${rows}</div>`;
}

/* ── 渲染：整页 ── */

function buildSections() {
  const d = state.data;
  const tops = d.entities.filter(e => !e.parent || !state.byId.has(e.parent));
  const q = state.q.toLowerCase();
  const out = [];
  let no = 0;
  for (const sec of d.sections) {
    if (sec.id === 'statements') {
      if (!d.expressions.length) continue;
      const xs = d.expressions.filter(x => !q || `${x.purpose} ${x.text}`.toLowerCase().includes(q));
      out.push({ sec, no: ++no, count: xs.length, html: xs.map(statement).join('') });
      continue;
    }
    const all = tops.filter(e => e.section === sec.id);
    if (!all.length) continue;
    no++;
    let count = 0, html = '';
    if (sec.id === 'profile') {
      const shown = all.filter(selfMatch);
      count = shown.length;
      html = shown.map(profileCard).join('');
    } else if (sec.id === 'award' || sec.id === 'skill') {
      const shown = all.filter(selfMatch);
      count = shown.length;
      if (count) html = sec.id === 'award' ? awardList(shown) : skillList(shown);
    } else {
      const trees = all.map(visibleTree).filter(Boolean);
      count = trees.reduce((n, t) => n + 1 + t.kids.length, 0);
      html = trees.map(t => entityCard(t.e, t.kids)).join('');
    }
    out.push({ sec, no, count, html });
  }
  return out;
}

function render() {
  copyReg = [];
  const d = state.data;
  const sections = buildSections();
  const total = sections.reduce((n, s) => n + s.count, 0);
  const pad = n => String(n).padStart(2, '0');

  document.getElementById('nav').innerHTML = sections.map(({ sec, no, count }) =>
    `<a href="#sec-${sec.id}" data-sec="${sec.id}" class="${count ? '' : 'is-empty'}"><span class="no">${pad(no)}</span><span class="lb">${esc(sec.label)}</span><span class="n">${count}</span></a>`
  ).join('');

  const body = sections.filter(s => s.count).map(({ sec, no, count, html }) => `
    <section class="sec" id="sec-${sec.id}" data-sec="${sec.id}">
      <header class="sec-head"><span class="sec-no">${pad(no)}</span><h2>${esc(sec.label)}</h2><span class="sec-en">${esc(sec.en || '')}</span><span class="sec-n">${count} 项</span></header>
      ${html}
    </section>`).join('');

  const exported = d.lastExportedAt ? ` · ${esc(d.lastExportedAt.slice(0, 10))} 导出快照` : '';
  const warnings = [];
  if (d.integrity?.changedSources) warnings.push(`${d.integrity.changedSources} 份来源文件已变更`);
  if (d.integrity?.missingSources) warnings.push(`${d.integrity.missingSources} 份来源文件缺失`);
  if (d.integrity?.unreadableSources) warnings.push(`${d.integrity.unreadableSources} 份来源文件无法读取`);
  if (d.counts.invalidExpressions) warnings.push(`${d.counts.invalidExpressions} 条文案因事实依据失效已隐藏`);
  if (d.counts.pendingExpressions) warnings.push(`${d.counts.pendingExpressions} 条文案待确认`);
  const notice = warnings.length ? `<p>${warnings.map(esc).join('；')}。请核对材料与文案。</p>` : '';
  const foot = `<footer class="foot">${notice}共 ${d.counts.facts} 条已确认事实，出自 ${d.counts.sources} 份材料，其中 ${d.counts.primaryBacked} 条关联到暂归一手的来源${d.profileRevision ? ` · 数据修订 ${esc(d.profileRevision)}` : ''}${exported}。<br>来源等级由文件名推测，需结合原件核验。页面只在本机读取数据库，不联网、不写入。</footer>`;

  document.getElementById('main').innerHTML = total
    ? body + foot
    : `<div class="empty">没有找到与“${esc(state.q)}”相关的内容<br><button type="button" data-clear>清空搜索</button></div>`;

  document.getElementById('qn').textContent = state.q ? `${total} 项` : '';
  document.getElementById('searchBox').classList.toggle('has-q', !!state.q);
  measure();
  spy();
}

// 重渲染前后保持视线停在同一条目上，切换语言时不跳位置
function keepAnchor(fn) {
  const top = parseFloat(getComputedStyle(root).getPropertyValue('--sticky')) || 0;
  const el = [...document.querySelectorAll('main [id^="e-"]')].find(n => n.getBoundingClientRect().bottom > top + 8);
  const before = el?.getBoundingClientRect().top;
  fn();
  const again = el && document.getElementById(el.id);
  if (again) window.scrollBy({ top: again.getBoundingClientRect().top - before, behavior: 'instant' });
}

/* ── 吸顶与当前位置 ── */

function measure() {
  const tb = document.querySelector('.topbar').offsetHeight;
  const rail = document.querySelector('.rail');
  root.style.setProperty('--tb', tb + 'px');
  root.style.setProperty('--sticky', (tb + (NARROW.matches ? rail.offsetHeight : 0)) + 'px');
}

let activeSec = '';
function spy() {
  const secs = [...document.querySelectorAll('.sec')];
  if (!secs.length) return;
  const line = (parseFloat(getComputedStyle(root).getPropertyValue('--sticky')) || 0) + 40;
  let cur = secs[0];
  for (const s of secs) if (s.getBoundingClientRect().top <= line) cur = s;
  if (window.innerHeight + window.scrollY >= document.documentElement.scrollHeight - 4) cur = secs[secs.length - 1];
  const id = cur.dataset.sec;
  const nav = document.getElementById('nav');
  nav.querySelectorAll('a').forEach(a => a.classList.toggle('on', a.dataset.sec === id));
  if (id !== activeSec && NARROW.matches) {
    const a = nav.querySelector(`a[data-sec="${id}"]`);
    if (a) nav.scrollTo({ left: a.offsetLeft - 16, behavior: 'smooth' });
  }
  activeSec = id;
}

let spyQueued = false;
window.addEventListener('scroll', () => {
  if (spyQueued) return;
  spyQueued = true;
  requestAnimationFrame(() => { spyQueued = false; spy(); });
}, { passive: true });
window.addEventListener('resize', () => { measure(); spy(); });

/* ── 交互 ── */

function setLang(lang) {
  state.lang = lang;
  store.set('pdb.lang', lang);
  document.querySelectorAll('#langSeg button').forEach(b => b.setAttribute('aria-checked', String(b.dataset.lang === lang)));
  root.lang = lang === 'en' ? 'en' : 'zh-CN';
}

function setShowSrc(on) {
  state.showSrc = on;
  store.set('pdb.src', on ? '1' : '0');
  document.body.classList.toggle('show-src', on);
  document.getElementById('srcBtn').setAttribute('aria-pressed', String(on));
}

document.addEventListener('click', ev => {
  const t = ev.target;

  const more = t.closest('[data-more]');
  if (more) {
    const key = more.dataset.more;
    state.expanded.has(key) ? state.expanded.delete(key) : state.expanded.add(key);
    const text = more.previousElementSibling;
    const folded = !state.expanded.has(key);
    text.classList.toggle('clamp', folded);
    more.textContent = folded ? '展开全文' : '收起';
    return;
  }

  const src = t.closest('[data-src]');
  if (src) {
    const key = src.dataset.src;
    const open = !state.openSrc.has(key);
    open ? state.openSrc.add(key) : state.openSrc.delete(key);
    src.setAttribute('aria-expanded', String(open));
    document.querySelector(`[data-src-box="${CSS.escape(key)}"]`)?.classList.toggle('open', open);
    return;
  }

  if (t.closest('[data-clear]')) {
    const input = document.getElementById('q');
    input.value = '';
    state.q = '';
    render();
    input.focus();
    return;
  }

  const copyEl = t.closest('[data-c]');
  if (copyEl) {
    // 用户正在拖选其中一段文字时，不要用整段内容覆盖剪贴板
    if (String(window.getSelection() || '').trim() && copyEl.matches('.text, li')) return;
    copyFrom(copyEl);
  }
});

document.getElementById('langSeg').addEventListener('click', ev => {
  const btn = ev.target.closest('button[data-lang]');
  if (!btn || btn.dataset.lang === state.lang) return;
  setLang(btn.dataset.lang);
  keepAnchor(render);
});

document.getElementById('srcBtn').addEventListener('click', () => setShowSrc(!state.showSrc));

document.getElementById('q').addEventListener('input', ev => {
  const had = !!state.q;
  state.q = ev.target.value.trim();
  render();
  if (state.q && !had) window.scrollTo({ top: 0, behavior: 'instant' });
});

document.addEventListener('keydown', ev => {
  const input = document.getElementById('q');
  const typing = ev.target.closest?.('input, textarea, [contenteditable="true"]');
  if ((ev.metaKey || ev.ctrlKey) && ev.key.toLowerCase() === 'k') {
    ev.preventDefault();
    input.focus();
    input.select();
  } else if (ev.key === '/' && !typing) {
    ev.preventDefault();
    input.focus();
  } else if (ev.key === 'Escape' && ev.target === input) {
    if (input.value) {
      input.value = '';
      state.q = '';
      render();
    } else {
      input.blur();
    }
  }
});

/* ── 启动 ── */

setLang(state.lang);
setShowSrc(state.showSrc);
measure();

fetch('/api/profile')
  .then(r => r.json())
  .then(data => {
    if (data.error) throw new Error(data.error);
    state.data = data;
    prepare(data);
    const person = data.entities.find(e => e.type === 'person');
    if (person) document.title = `${person.name} · 个人资料库`;
    render();
    // 内容是异步渲染的，带锚点打开时浏览器找不到目标，渲染完补一次定位
    if (location.hash.length > 1) document.getElementById(decodeURIComponent(location.hash.slice(1)))?.scrollIntoView();
  })
  .catch(err => {
    document.getElementById('main').innerHTML = `<div class="empty">读取失败：${esc(err.message)}</div>`;
  });
</script>
</body>
</html>
